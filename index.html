<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#f5f3ed"><title>吾日检视</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f3ed;color:#263b34;font:15px/1.6 -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}main{max-width:650px;margin:auto;padding:24px 18px 110px}h1{font-family:serif;font-size:34px;margin:8px 0 0;letter-spacing:4px}h2{font-size:19px;margin:0 0 12px}p{margin:4px 0;color:#718078}small{color:#78847b}button,input,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:9px;background:#eaece5;color:#52645a;padding:9px 12px}button.active,.primary{background:#315e4d;color:white}button:focus-visible{outline:2px solid #a88650}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}section,.panel{background:#fffdf8;border:1px solid #e7e5db;border-radius:16px;padding:18px;margin:12px 0} .line{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 0;border-bottom:1px solid #eeeae1}.line:last-child{border:0}.line b{font-size:16px}.desc{font-size:12px;color:#7b8279}.choices{display:flex;gap:4px;flex-shrink:0}.choices button{font-size:12px;padding:8px 9px}.choices .s2{background:#315e4d;color:white}.choices .s1{background:#d8b66c;color:#473817}.choices .s0{background:#b66d61;color:white}.bar{height:7px;background:#e8ebe3;border-radius:8px;overflow:hidden;margin:12px 0}.bar i{display:block;height:100%;background:#618b73;border-radius:8px}textarea{width:100%;border:1px solid #e4e5dc;border-radius:10px;padding:12px;background:#faf9f4;resize:vertical;min-height:76px;margin:6px 0 14px;color:inherit}input[type=date]{border:1px solid #dedfd5;background:#fffdf8;border-radius:8px;padding:8px;color:inherit;max-width:145px}nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:#fffdf8;border-top:1px solid #e2e3da;padding:10px 8px calc(10px + env(safe-area-inset-bottom));gap:8px}nav button{width:30%;max-width:200px;background:transparent}nav button.active{background:#e4eee6;color:#315e4d;font-weight:700}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.metric{background:#edf0e8;padding:12px;border-radius:10px;text-align:center}.metric strong{display:block;font-size:26px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}.calendar button{aspect-ratio:1;padding:0;background:#f0eee6;position:relative}.calendar button.done{background:#c6dfc9}.calendar button.partial{background:#ead7a7}.calendar button.today{outline:2px solid #315e4d}.calendar button.selected{box-shadow:inset 0 0 0 2px #315e4d}.month{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.statrow{margin:14px 0}.statrow .bar{display:flex;margin:5px 0;height:9px}.statrow .bar i{border-radius:0}.actions{display:flex;gap:8px;flex-wrap:wrap}.wide{width:100%;padding:13px}.hidden{display:none} .tag{font-size:12px;letter-spacing:2px;color:#9a8864}.notice{font-size:12px;color:#8a7562} @media(max-width:360px){main{padding-left:10px;padding-right:10px}section{padding:12px}.choices button{padding:7px 5px}}
</style><main><header><div><div class="tag">每日三省 · 修己而行</div><h1>吾日检视</h1><p>不求无过，但求日进。</p></div><span style="font:38px serif;color:#9b987e">省</span></header><div id="daily"><section><div class="month"><b>今日言行</b><input id="date" type="date"></div><div id="progress"></div><div class="bar"><i id="fill"></i></div><small id="saved">自动保存至本机</small></section><section id="items"></section><section><h2>每日三省</h2><label>今日最值得反省的一件事</label><textarea id="event" placeholder="发生了什么？我当时为何如此？"></textarea><label>今日所得</label><textarea id="gain" placeholder="一个新的认知、判断或经验"></textarea><label>明日只改一件事</label><textarea id="change" placeholder="具体可执行的小改变"></textarea><button class="primary wide" id="finish">完成今日打卡</button><p id="message" aria-live="polite"></p></section></div><div id="history" class="hidden"><section><h2>打卡日历</h2><div class="month"><button id="prev">‹</button><b id="month"></b><button id="next">›</button></div><div id="calendar" class="calendar"></div><p><small>绿色：已完成 · 黄色：未完成 · 点击日期查看或补记</small></p></section><section id="detail"></section></div><div id="stats" class="hidden"><section><h2>修习记录</h2><div class="actions" id="period"><button data-days="7">近7天</button><button data-days="30" class="active">近30天</button><button data-days="0">全部</button></div><div class="metrics" id="metrics" style="margin-top:16px"></div></section><section><h2>十二条表现</h2><small>绿色 做到 · 黄色 欠缺 · 红色 失守；仅统计已评价项目</small><div id="breakdown"></div></section><section><h2>数据管理</h2><div class="actions"><button id="export">导出备份</button><button id="import">导入备份</button><input type="file" id="file" accept=".json,application/json" hidden><button id="copy">复制当日记录</button></div><p class="notice">数据仅存于当前浏览器。换手机、清缓存前请备份。</p></section></div></main><nav><button data-tab="daily" class="active">每日检视</button><button data-tab="history">历史日历</button><button data-tab="stats">统计分析</button></nav><script>
const L=[['专心','做事专一，听人用心'],['静心','留有独处，不被信息裹挟'],['守时','规律作息，不透支明日'],['深学','深入理解，不浮于表面'],['明理','辨明方向，探究本质'],['慎言','先听后说，不妄评他人'],['稳心','情绪有觉察，处事有分寸'],['养身','节饮食，适运动，足睡眠'],['日有所得','有所新知，有所沉淀'],['常习所长','磨炼本领，不荒废所长'],['务实有成','少空想，多行动，有结果'],['顾家有度','用心待家人，娱乐有节']];const $=id=>document.getElementById(id), key='daily-reflection-v1', iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`, today=iso(new Date());let db={};try{db=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){}let date=today,month=new Date(),days=30;const empty=()=>({scores:{},event:'',gain:'',change:'',done:false});const get=()=>db[date]||empty();function save(){try{localStorage.setItem(key,JSON.stringify(db));$('saved').textContent='已自动保存至本机'}catch(e){$('saved').textContent='保存失败，请导出备份'}}function mutate(fn){db[date]=get();fn(db[date]);save()}function render(){const r=get();$('date').value=date;$('date').max=today;$('items').innerHTML='';L.forEach(([name,desc],i)=>{let el=document.createElement('div');el.className='line';el.innerHTML=`<div><b>${String(i+1).padStart(2,'0')} · ${name}</b><div class="desc">${desc}</div></div><div class="choices"></div>`;[2,1,0].forEach((v,j)=>{let b=document.createElement('button');b.textContent=['做到','欠缺','失守'][j];b.className=r.scores[i]===v?'s'+v:'';b.setAttribute('aria-pressed',r.scores[i]===v);b.onclick=()=>{mutate(x=>{if(x.scores[i]===v){delete x.scores[i];x.done=false}else x.scores[i]=v});render()};el.lastChild.append(b)});$('items').append(el)});let n=Object.keys(r.scores).length;$('progress').textContent=`已检视 ${n}/12 项${r.done?' · 已打卡':''}`;$('fill').style.width=n/12*100+'%';['event','gain','change'].forEach(k=>$(k).value=r[k]||'');$('finish').textContent=r.done?'已完成 · 可继续修改':'完成当日打卡';$('message').textContent=''}['event','gain','change'].forEach(k=>$(k).oninput=e=>mutate(r=>r[k]=e.target.value));$('date').onchange=e=>{if(e.target.value&&e.target.value<=today){date=e.target.value;render()}};$('finish').onclick=()=>{if(Object.keys(get().scores).length!==12){$('message').textContent='还有未检视的条目，请先完成十二条评价。';return}mutate(r=>r.done=true);render();$('message').textContent='已完成打卡。今日有所省，明日有所进。'};function tab(t){['daily','history','stats'].forEach(x=>$(x).classList.toggle('hidden',x!==t));document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));if(t==='daily')render();if(t==='history')cal();if(t==='stats')stats();window.scrollTo(0,0)}document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>tab(b.dataset.tab));function cal(){let y=month.getFullYear(),m=month.getMonth();$('month').textContent=`${y}年 ${m+1}月`;$('calendar').innerHTML='';['一','二','三','四','五','六','日'].forEach(x=>{let a=document.createElement('small');a.textContent=x;$('calendar').append(a)});for(let i=0;i<(new Date(y,m,1).getDay()+6)%7;i++)$('calendar').append(document.createElement('span'));for(let i=1;i<=new Date(y,m+1,0).getDate();i++){let d=iso(new Date(y,m,i)),b=document.createElement('button');b.textContent=i;b.className=(db[d]?.done?'done':db[d]?'partial':'')+(d===today?' today':'')+(d===date?' selected':'');b.disabled=d>today;b.onclick=()=>{date=d;cal()};$('calendar').append(b)}let r=get();$('detail').replaceChildren();let h=document.createElement('h2');h.textContent=date+' · '+(r.done?'已打卡':'未完成');$('detail').append(h);L.forEach((l,i)=>{let p=document.createElement('p');p.textContent=l[0]+'：'+(['失守','欠缺','做到'][r.scores[i]]||'未评价');$('detail').append(p)});['event','gain','change'].forEach((k,i)=>{let p=document.createElement('p');p.textContent=['反省','所得','明日改进'][i]+'：'+(r[k]||'—');$('detail').append(p)});let b=document.createElement('button');b.textContent='查看 / 修改当日检视';b.onclick=()=>tab('daily');$('detail').append(b)}$('prev').onclick=()=>{month=new Date(month.getFullYear(),month.getMonth()-1,1);cal()};$('next').onclick=()=>{month=new Date(month.getFullYear(),month.getMonth()+1,1);cal()};function stats(){let start=new Date();start.setDate(start.getDate()-days+1);let rows=Object.entries(db).filter(([d])=>d<=today&&(!days||d>=iso(start))), done=rows.filter(([,r])=>r.done).length,vals=rows.flatMap(([,r])=>Object.values(r.scores));let streak=0,d=new Date();if(!db[today]?.done)d.setDate(d.getDate()-1);while(db[iso(d)]?.done){streak++;d.setDate(d.getDate()-1)}$('metrics').innerHTML=[['打卡天数',done],['做到占比',vals.length?Math.round(vals.filter(v=>v===2).length/vals.length*100)+'%':'—'],['当前连续',streak+'天']].map(([l,v])=>`<div class="metric"><strong>${v}</strong><small>${l}</small></div>`).join('');$('breakdown').innerHTML=L.map(([l],i)=>{let c=[0,0,0];rows.forEach(([,r])=>{if(r.scores[i]!==undefined)c[r.scores[i]]++});let n=c.reduce((a,b)=>a+b,0);return `<div class="statrow"><div style="display:flex;justify-content:space-between"><b>${l}</b><small>${n?Math.round(c[2]/n*100)+'% 做到':'暂无记录'} · ${n}次</small></div><div class="bar">${[2,1,0].map(v=>`<i style="width:${n?c[v]/n*100:0}%;background:${['#b66d61','#d8b66c','#618b73'][v]}"></i>`).join('')}</div><small>做到 ${c[2]} · 欠缺 ${c[1]} · 失守 ${c[0]}</small></div>`}).join('')}document.querySelectorAll('#period button').forEach(b=>b.onclick=()=>{days=+b.dataset.days;document.querySelectorAll('#period button').forEach(x=>x.classList.toggle('active',x===b));stats()});$('export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='吾日检视-'+today+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{try{let obj=JSON.parse(await e.target.files[0].text());if(!obj||Array.isArray(obj)||typeof obj!=='object'||Object.entries(obj).some(([d,r])=>!/^\d{4}-\d{2}-\d{2}$/.test(d)||!r||!r.scores||Object.entries(r.scores).some(([i,v])=>!/^([0-9]|1[01])$/.test(i)||![0,1,2].includes(v))||['event','gain','change'].some(k=>typeof r[k]!=='string')||typeof r.done!=='boolean'||(r.done&&Object.keys(r.scores).length!==12)))throw Error();if(confirm('导入备份？相同日期的记录将被覆盖。')){db={...db,...obj};save();stats();alert('导入完成')}}catch(e){alert('备份格式不正确，未导入。')}$('file').value=''};$('copy').onclick=async()=>{let r=get(),s=date+' 吾日检视\n'+L.map((l,i)=>l[0]+'：'+(['失守','欠缺','做到'][r.scores[i]]||'未评价')).join('\n')+'\n反省：'+r.event+'\n所得：'+r.gain+'\n明日：'+r.change;try{await navigator.clipboard.writeText(s);alert('已复制')}catch(e){prompt('请手动复制',s)}};render();</script></html>
